name: Deploy my-cove-be

# Auto-deploy to the DigitalOcean droplet (165.227.45.213) on every push to master.
# GitHub's runner SSHes in (port 22, left open by the firewall lockdown) and runs the
# same steps you'd run by hand.
on:
  push:
    branches: [master]
    paths-ignore:           # docs-only pushes don't need a redeploy
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:        # also lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e   # fail the whole job if ANY command below errors (e.g. a broken build)
            # nvm is NOT auto-loaded in a non-interactive SSH session — source it, then select
            # Node 20 (Strapi 5 requires >=20). The box's default nvm Node is 16, still used by
            # the nxxtoolbox v4 app — don't change the default, just select 20 for this build.
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm use 20

            cd ~/projects/my-cove/backend
            git fetch origin
            git reset --hard origin/master   # match the repo exactly (ignores .env, build/, node_modules — all gitignored)
            npm install                      # committed lockfile exists; install is incremental (avoids npm ci wiping node_modules on the 2GB box)
            # 2 GB droplet: the Strapi 5 admin (Vite) build is memory-heavy — raise Node's heap
            # ceiling and rely on the swapfile (see runbook) so it doesn't OOM mid-build.
            NODE_OPTIONS=--max-old-space-size=1536 NODE_ENV=production npm run build
            # startOrReload re-reads ecosystem.config.js each deploy, so the Node 20 interpreter
            # pinned there is always applied (a plain `pm2 restart <name>` would keep the stale
            # Node 16 interpreter). ecosystem.config.js is gitignored on the box — pin Node 20 there.
            pm2 startOrReload ecosystem.config.js --update-env
